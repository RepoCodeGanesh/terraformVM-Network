trigger:
  branches:
    include:
      - main
      - development
  paths:
    include:
      - '**/*.tf'
      - '**/*.tfvars'

pr:
  branches:
    include:
      - main
      - development
  paths:
    include:
      - '**/*.tf'
      - '**/*.tfvars'

variables:
- group: Terraform-Secrets

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: TerraformInstaller@0
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: '1.5.0'

- task: TerraformTaskV3@3
  displayName: 'Terraform Init'
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    backendServiceArm: '64d51c9d-f7f6-4ff2-8341-75d6cc57fe01'  # Azure service connection
    backendAzureRmResourceGroupName: 'terraform'  # From backend.tf
    backendAzureRmStorageAccountName: 'tfstateforterrform'  # From backend.tf
    backendAzureRmContainerName: 'tfstate'  # From backend.tf
    backendAzureRmKey: 'prod.terraform.tfstate'

- task: TerraformTaskV3@3
  displayName: 'Terraform Validate'
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)'

- script: |
    terraform plan -no-color -out=tfplan | tee plan.txt
  displayName: 'Terraform Plan'
  workingDirectory: '$(System.DefaultWorkingDirectory)'
  env:
    TF_VAR_client_secret: $(CLIENT_SECRET)

- task: PublishBuildArtifacts@1
  displayName: 'Publish Terraform Plan Artifact'
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/tfplan'
    ArtifactName: 'terraform-plan'
    publishLocation: 'Container'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Terraform Plan Text'
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/plan.txt'
    ArtifactName: 'terraform-plan-text'
    publishLocation: 'Container'

