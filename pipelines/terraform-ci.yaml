trigger:
  branches:
    include:
      - main
      - development
  paths:
    include:
      - '**/*.tf'
      - '**/*.tfvars'

pr:
  branches:
    include:
      - main
      - development
  paths:
    include:
      - '**/*.tf'
      - '**/*.tfvars'

variables:
- group: Terraform-Secrets

pool:
  vmImage: ubuntu-latest

steps:

# Install Terraform
- task: TerraformInstaller@1
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: '1.5.0'

# Terraform Init
- task: TerraformTaskV4@4
  displayName: 'Terraform Init'
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    backendServiceArm: '64d51c9d-f7f6-4ff2-8341-75d6cc57fe01'
    backendAzureRmResourceGroupName: 'terraform'
    backendAzureRmStorageAccountName: 'tfstateforterrform'
    backendAzureRmContainerName: 'tfstate'
    backendAzureRmKey: '$(Build.SourceBranchName).terraform.tfstate'

# Terraform Validate
- task: TerraformTaskV4@4
  displayName: 'Terraform Validate'
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)'

# Terraform Plan
- task: TerraformTaskV4@4
  displayName: 'Terraform Plan'
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)'
    environmentServiceNameAzureRM: '64d51c9d-f7f6-4ff2-8341-75d6cc57fe01'
    commandOptions: '-no-color -out=tfplan'
  env:
    TF_VAR_client_secret: $(CLIENT_SECRET)

# Generate plan.txt
- script: |
    terraform show -no-color tfplan > plan.txt
  displayName: 'Generate Terraform Plan Text'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

# Verify files
- script: |
    ls -la
    echo "------------ PLAN TXT -------------"
    head -100 plan.txt
  displayName: 'Verify Generated Files'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

# Run Python Summary Script
- script: |
    python3 scripts/terraform_summary.py
  displayName: 'Generate Terraform Summary'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

# Publish tfplan artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish Terraform Binary Plan'
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/tfplan'
    ArtifactName: 'terraform-plan'
    publishLocation: 'Container'

# Publish plan.txt
- task: PublishBuildArtifacts@1
  displayName: 'Publish Terraform Plan Text'
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/plan.txt'
    ArtifactName: 'terraform-plan-text'
    publishLocation: 'Container'

# Publish GitHub Issue body
- task: PublishBuildArtifacts@1
  displayName: 'Publish GitHub Issue Body'
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/issue_body.md'
    ArtifactName: 'terraform-issue-body'
    publishLocation: 'Container'

# Create GitHub Issue
- script: |
    sudo apt-get update
    sudo apt-get install -y gh

    echo "$(GITHUB_TOKEN)" > github_token.txt
    gh auth login --with-token < github_token.txt

    gh issue create \
      --title "Terraform Plan for $(Build.SourceBranchName)" \
      --body-file issue_body.md
  displayName: 'Create GitHub Issue'
  workingDirectory: '$(System.DefaultWorkingDirectory)'
  env:
    GITHUB_TOKEN: $(GITHUB_TOKEN)
